name: Import Last Five Modern Era Results
on:
  push:
    branches: [feature/modern-last-five-scores]
    paths:
      - 'scripts/enrich_modern_last_five.py'
      - '.github/workflows/enrich-modern-last-five.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/modern-last-five-scores
          persist-credentials: true
      - name: Reconcile published points to all five catalogue editions
        run: python scripts/enrich_modern_last_five.py
      - name: Validate original and modern archive
        run: python scripts/validate_unified_results.py
      - name: Commit only verified results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/data/modern/editions/
          if ! git diff --cached --quiet; then
            git commit -m "Import validated early modern scoring exceptions"
            git push origin HEAD:feature/modern-last-five-scores
          fi
