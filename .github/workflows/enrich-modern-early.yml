name: Import Modern Era Early Scores 12-19
on:
  push:
    branches: [feature/modern-early-points-12-19]
    paths:
      - 'scripts/enrich_modern_early_batch.py'
      - 'scripts/import_published_early_edition.py'
      - '.github/workflows/enrich-modern-early.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/modern-early-points-12-19
          persist-credentials: true
      - name: Import verified early editions
        run: python scripts/enrich_modern_early_batch.py > /tmp/early-scores.log && grep -E 'VERIFIED_EDITION|NEEDS_REVIEW|TABLE_SAMPLES' /tmp/early-scores.log
      - name: Validate full archive
        run: python scripts/validate_unified_results.py
      - name: Commit verified results only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/data/modern/editions/
          if ! git diff --cached --quiet; then
            git commit -m "Attach verified published points to early Modern Era editions"
            git push origin HEAD:feature/modern-early-points-12-19
          fi
