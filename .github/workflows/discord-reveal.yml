
name: WSC GenZ Qualifier Reveal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview, Test, or Live (only after results are final)"
        type: choice
        options:
          - preview
          - test
          - live
        default: preview
        required: true
      confirmation:
        description: "For Live only, enter REVEAL48 (otherwise leave blank)"
        type: string
        default: ""
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: wsc-genz-48-qualifier-reveal
  cancel-in-progress: false

jobs:
  reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GitHub reveal lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Checking GitHub Issues API..."
          gh api "repos/$GH_REPO/issues?state=all&per_page=100" \
            --jq '[.[] | select(.title == "WSC48-QUALIFIER-REVEAL-LIVE-STARTED-DO-NOT-RESTART")] | length'
          echo "GitHub Issues API connection successful."

      - name: Test GitHub Issues write access
        if: ${{ inputs.mode == 'preview' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Creating temporary test issue..."
          ISSUE_NUMBER=$(gh api \
            --method POST \
            "repos/$GH_REPO/issues" \
            -f title="WSC48-SAFETY-TEST-TEMPORARY" \
            -f body="Temporary permission test. Not the live reveal lock." \
            --jq '.number')

          echo "Created test issue #$ISSUE_NUMBER"

          echo "Verifying issue exists..."
          gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" \
            --jq '.title'

          echo "Closing test issue..."
          gh api --method PATCH \
            "repos/$GH_REPO/issues/$ISSUE_NUMBER" \
            -f state=closed \
            --silent

          echo "GitHub Issues write test successful."

      - name: Run qualifier reveal
        env:
          DISCORD_QUALIFIER_WEBHOOK: ${{ secrets.DISCORD_QUALIFIER_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirmation }}
        run: |
          python3 scripts/qualifier_reveal.py --mode "$MODE" --confirm "$CONFIRM"
