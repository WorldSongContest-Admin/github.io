
name: WSC GenZ Qualifier Reveal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose Preview or Test"
        type: choice
        options:
          - preview
          - test
        default: preview
        required: true

permissions:
  contents: read

jobs:
  reveal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run qualifier reveal
        env:
          DISCORD_QUALIFIER_WEBHOOK: ${{ secrets.DISCORD_QUALIFIER_WEBHOOK }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 scripts/qualifier_reveal.py --mode "$MODE"
