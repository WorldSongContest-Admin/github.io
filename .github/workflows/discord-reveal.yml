name: WSC GenZ Qualifier Reveal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose Preview or Test"
        type: choice
        options:
          - preview
          - test
          - live
        default: preview
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: wsc-genz-48-qualifier-reveal
  cancel-in-progress: false

jobs:
  reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run qualifier reveal
        env:
          DISCORD_QUALIFIER_WEBHOOK: ${{ secrets.DISCORD_QUALIFIER_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 scripts/qualifier_reveal.py --mode "$MODE"
