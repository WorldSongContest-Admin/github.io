name: Audit Modern Editions 35 and 45
on:
  push:
    branches: [feature/modern-35-45-scores]
    paths:
      - 'scripts/enrich_modern_variable_tables.py'
      - '.github/workflows/modern-scores-variable.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/modern-35-45-scores
          persist-credentials: true
      - name: Cross-check every published score against the WSC catalogue
        run: python scripts/enrich_modern_variable_tables.py
      - name: Verify both eras and all records
        run: python scripts/validate_unified_results.py
      - name: Commit verified records only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/data/modern/editions/
          if ! git diff --cached --quiet; then
            git commit -m "Enrich Modern Era with strictly matched additional published scores"
            git push origin HEAD:feature/modern-35-45-scores
          fi
