name: Enrich Modern WSC Scores 32-46 21-30
on:
  push:
    branches: [feature/modern-points-21-30]
    paths:
      - 'scripts/enrich_modern_multistage.py'
      - '.github/workflows/enrich-modern-scores.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/modern-points-21-30
          persist-credentials: true
      - name: Cross-check and import published final and semi-final scores
        run: python scripts/enrich_modern_multistage.py
      - name: Validate both eras
        run: python scripts/validate_unified_results.py
      - name: Commit verified data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/data/modern/editions/
          if ! git diff --cached --quiet; then
            git commit -m "Enrich verified modern Editions 21-30 with published final and semifinal points"
            git push origin HEAD:feature/modern-points-21-30
          fi
